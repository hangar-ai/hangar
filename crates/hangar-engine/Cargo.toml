[package]
name = "hangar-engine"
description = "Hangar without its window: the persisted state of the workspaces, and the logic that runs them"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition = "2024"

# What runs the workspaces whatever draws them: the desktop app (hangar-app)
# and a Hangar with no window (docs/native/headless.md). Nothing here draws:
# no iced, no theme, no widgets.
[dependencies]
# Without `desktop`: what a node runs too (no dictation, notifications,
# Discord presence or phone server); the desktop app turns it on.
hangar-core = { path = "../hangar-core", default-features = false }
hangar-i18n.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# The orchestration engines: dates in the briefings, plan statuses, task
# titles folded to ASCII for branch names, and futures joined.
chrono.workspace = true
regex.workspace = true
unicode-normalization.workspace = true
futures = "0.3"
# The panes' screens of a host with no window (host/screen.rs): the emulator
# the desktop's terminals use, without their widget.
alacritty_terminal.workspace = true

[dev-dependencies]
tempfile = "3"

# What the host with no window costs where it is busiest (benches/host.rs).
[[bench]]
name = "host"
harness = false

# What grows with what a server holds (benches/scale.rs): memory per pane,
# the state, transcripts, boards, and what a host costs doing nothing.
[[bench]]
name = "scale"
harness = false

[features]
# What the hosts' tests need to put the engine in a state (seeding a pane's
# activity, running a sweep by hand): off in a build, on for tests.
testing = []
